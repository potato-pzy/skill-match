{% extends 'base/base.html' %}

{% block content %}
<style>
    body {
        background-color: #1a1a1a !important;
        color: white !important;
    }

    .choice-container {
        min-height: calc(100vh - 150px);
        display: flex;
        align-items: center;
        padding: 20px;
        background-color: #1a1a1a;
    }

    .choice-card {
        background-color: #000000;
        border-radius: 15px;
        overflow: hidden;
        width: 100%;
        max-width: 400px;
        margin: 0 auto;
        padding: 30px;
    }

    .choice-header {
        text-align: center;
        margin-bottom: 30px;
    }

    .choice-header h2 {
        color: white;
        font-size: 24px;
        font-weight: 600;
    }

    .choice-btn {
        background: linear-gradient(to right, #512da8, #5c6bc0);
        color: white;
        border: none;
        height: 50px;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 500;
        width: 100%;
        margin: 15px 0;
        cursor: pointer;
        transition: all 0.3s ease;
        display: block;
        text-align: center;
        text-decoration: none;
        line-height: 50px;
    }

    .choice-btn:hover {
        opacity: 0.9;
        transform: translateY(-2px);
        color: white;
        text-decoration: none;
    }

    .choice-text {
        text-align: center;
        color: rgba(255, 255, 255, 0.7);
        margin-top: 20px;
    }

    .choice-text a {
        color: #5c6bc0;
        text-decoration: none;
    }

    @media (max-width: 576px) {
        .choice-container {
            padding: 15px;
        }

        .choice-card {
            padding: 20px;
        }

        .choice-header h2 {
            font-size: 20px;
        }

        .choice-btn {
            font-size: 15px;
            height: 45px;
            line-height: 45px;
        }
    }
</style>

<div class="choice-container">
    <div class="choice-card">
        <div class="choice-header">
            <h2>Login to Your Account</h2>
            <p style="color: rgba(255, 255, 255, 0.7);">Select your account type to login</p>
        </div>
        
        <a href="{% url 'login_jobseaker' %}" class="choice-btn">
            <i class="fas fa-user-tie"></i> Login as Job Seeker
        </a>
        <div class="choice-text">
            Don't have a job seeker account? <a href="{% url 'register_jobseeker' %}">Sign up</a>
        </div>
        
        <a href="{% url 'login_provider' %}" class="choice-btn" style="margin-top: 30px;">
            <i class="fas fa-building"></i> Login as Job Provider
        </a>
        <div class="choice-text">
            Don't have a job provider account? <a href="{% url 'register_provider' %}">Sign up</a>
        </div>
    </div>
</div>
{% endblock %}
