{% extends 'base/base.html' %}
{% load static %}

{% block content %}
<style>
    .edit-profile-container {
        max-width: 800px;
        margin: 40px auto;
        padding: 20px;
        background-color: #fff;
        border-radius: 12px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .edit-profile-header {
        text-align: center;
        margin-bottom: 30px;
        padding-bottom: 20px;
        border-bottom: 2px solid #f0f0f0;
    }

    .current-profile-image {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        object-fit: cover;
        margin-bottom: 15px;
        border: 4px solid #512da8;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-label {
        font-weight: 600;
        color: #512da8;
        margin-bottom: 5px;
    }

    .form-control {
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 10px;
        width: 100%;
    }

    .form-control:focus {
        border-color: #512da8;
        box-shadow: 0 0 0 0.2rem rgba(81, 45, 168, 0.25);
    }

    .checkbox-group {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 10px;
    }

    .checkbox-item {
        display: flex;
        align-items: center;
        gap: 5px;
    }

    .checkbox-item input[type="checkbox"] {
        accent-color: #512da8;
    }

    .save-btn {
        background: linear-gradient(to right, #512da8, #5c6bc0);
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 8px;
        font-size: 1rem;
        cursor: pointer;
        transition: all 0.3s ease;
        width: 100%;
        margin-top: 20px;
    }

    .save-btn:hover {
        opacity: 0.9;
    }

    .cancel-btn {
        background: #6c757d;
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 8px;
        font-size: 1rem;
        cursor: pointer;
        transition: all 0.3s ease;
        width: 100%;
        margin-top: 10px;
        text-decoration: none;
        display: inline-block;
        text-align: center;
    }

    .cancel-btn:hover {
        opacity: 0.9;
        color: white;
        text-decoration: none;
    }

    @media (max-width: 768px) {
        .edit-profile-container {
            margin: 20px;
            padding: 15px;
        }
    }
</style>

<div class="edit-profile-container">
    <div class="edit-profile-header">
        <h2>Edit Profile</h2>
        {% if jobseeker.profile %}
            <img src="{{ jobseeker.profile.url }}" alt="Current Profile Picture" class="current-profile-image">
        {% endif %}
    </div>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        
        <div class="form-group">
            <label class="form-label" for="first_name">First Name</label>
            <input type="text" class="form-control" id="first_name" name="first_name" value="{{ jobseeker.first_name }}" required>
        </div>

        <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <input type="email" class="form-control" id="email" name="email" value="{{ user.email }}" required>
        </div>

        <div class="form-group">
            <label class="form-label" for="phone">Phone Number</label>
            <input type="tel" class="form-control" id="phone" name="phone" value="{{ jobseeker.phone }}" required>
        </div>

        <div class="form-group">
            <label class="form-label" for="job_role">Job Role</label>
            <select class="form-control" id="job_role" name="job_role" required>
                {% for value, label in job_roles %}
                    <option value="{{ value }}" {% if jobseeker.job_role == value %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label class="form-label">Availability (Days)</label>
            <div class="checkbox-group">
                {% for day in days_of_week %}
                    <div class="checkbox-item">
                        <input type="checkbox" id="{{ day|lower }}" name="available_days" value="{{ day }}"
                               {% if day in selected_days %}checked{% endif %}>
                        <label for="{{ day|lower }}">{{ day }}</label>
                    </div>
                {% endfor %}
            </div>
        </div>

        <div class="form-group">
            <label class="form-label" for="start_time">Start Time</label>
            <input type="time" class="form-control" id="start_time" name="start_time" value="{{ jobseeker.start_time|time:'H:i' }}" required>
        </div>

        <div class="form-group">
            <label class="form-label" for="end_time">End Time</label>
            <input type="time" class="form-control" id="end_time" name="end_time" value="{{ jobseeker.end_time|time:'H:i' }}" required>
        </div>

        <div class="form-group">
            <label class="form-label" for="area">Area/Location</label>
            <input type="text" class="form-control" id="area" name="area" value="{{ jobseeker.area }}" required>
        </div>

        <div class="form-group">
            <label class="form-label" for="profile">Profile Picture</label>
            <input type="file" class="form-control" id="profile" name="profile" accept="image/*">
            <small class="text-muted">Leave empty to keep current picture</small>
        </div>

        <button type="submit" class="save-btn">Save Changes</button>
        <a href="{% url 'profile' %}" class="cancel-btn">Cancel</a>
    </form>
</div>
{% endblock %}
