services:
  - type: web
    name: skillmatch
    env: python
    region: ohio  # Choose your preferred region
    plan: free
    buildCommand: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
      python manage.py makemigrations --noinput
      python manage.py migrate --noinput
      python manage.py check_db
      python manage.py collectstatic --noinput
    startCommand: gunicorn skillmatch.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: skillmatch_db
          property: connectionString
      - key: DJANGO_ALLOWED_HOSTS
        value: "skill-match-1.onrender.com,.onrender.com"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://skill-match-1.onrender.com,https://*.onrender.com"
      - key: DJANGO_SETTINGS_MODULE
        value: "skillmatch.settings"
    disk:
      name: media-data
      mountPath: /opt/render/project/src/media
      sizeGB: 1
    healthCheckPath: /
    autoDeploy: true

  - type: postgresql
    name: skillmatch_db
    region: ohio  # Should match the web service region
    plan: free
    ipAllowList: []  # Only allow internal connections

staticAssets:
  - path: /static
    buildCommand: python manage.py collectstatic --noinput
    staticDirectory: staticfiles
  - path: /media
    staticDirectory: media 